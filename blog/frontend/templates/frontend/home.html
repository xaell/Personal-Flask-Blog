{% extends "frontend/base.html" %}
    {% block content %}
    <h1>Home Page</h1>
    <h1>All Posts</h1>
    <ul>
        {% for entries in data %}
            <li>
                <strong>{{ entries.title }}</strong> - {{ entries.created_at }}<br>
                {{ entries.body }}
            </li>
        {% endfor %}
    </ul>
{% endblock %}
